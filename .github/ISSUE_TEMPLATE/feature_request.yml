name: ✨ 功能建议
description: 提出一个新功能或改进想法
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        感谢你的建议！请描述你希望新增或改进的能力。

  - type: textarea
    id: problem
    attributes:
      label: 想解决的问题
      description: 你在什么场景下遇到了什么不便
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 期望的方案
      description: 你希望插件如何实现（尽量具体）
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案
      description: 是否考虑过其它实现方式
    validations:
      required: false

  - type: textarea
    id: extra
    attributes:
      label: 补充说明
      description: 截图、参考实现链接等
    validations:
      required: false
