name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Node ${{ matrix.node }} · smoke
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["18", "20", "22"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Syntax check
        run: |
          node --check lib/index.js
          node --check lib/client.js
      - name: Smoke tests
        run: node --test tests/smoke.test.mjs
      - name: E2E install tests
        run: |
          node scripts/mock-deepseek.mjs &
          MOCK_PID=$!
          sleep 1
          node --test tests/e2e-install-test.mjs
          kill $MOCK_PID || true
